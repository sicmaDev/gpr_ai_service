name: Deploy GPR AI Service

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            cd /home/gpr_ai/gpr_ai_service

            echo "Configure git safe directory"
            git config --global --add safe.directory /home/gpr_ai/gpr_ai_service

            echo "Pull latest code"
            git pull origin master

            echo "Activate venv"
            source venv/bin/activate

            echo "Install dependencies"
            pip install -r requirements.txt

            echo "Restart service"
            sudo systemctl restart gpr-ai

            echo "Check status"
            sudo systemctl is-active gpr-ai
